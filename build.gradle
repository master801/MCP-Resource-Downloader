plugins {
    id 'java'
    id 'io.freefair.lombok' version '9.2.0'
}

configure(allprojects) {
    apply plugin: 'java'
    apply plugin: 'io.freefair.lombok'

    group = 'org.slave'
    version = '1.3-Alpha'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
            vendor = JvmVendorSpec.ADOPTIUM
        }
    }

    lombok {
        version = '1.18.44'//Manually specify version
    }
}


allprojects {
    repositories {
        mavenCentral()
    }
}
